{% extends 'web/base.html' %}
{% load static %}
{% block title %}Projects{% endblock %}
{% block content %}

<!-- Page Header Start -->
<div class="page-header parallaxie">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-12">
                <!-- Page Header Box Start -->
                <div class="page-header-box">
                    <h1 class="wow fadeInUp" data-cursor="-opaque">our projects</h1>
                    <nav class="wow fadeInUp" data-wow-delay="0.2s">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/">home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">projects</li>
                        </ol>
                    </nav>
                </div>
                <!-- Page Header Box End -->
            </div>
        </div>
    </div>
</div>
<!-- Page Header End -->

<!-- Page Projects Start -->
<div class="page-projects">
    <div class="container">
        <div class="row">
          
            <div class="col-lg-12">
                <!-- Project Item Boxes start -->
                <div class="row project-item-boxes align-items-center">
                    {% for project in projects %}
                    <div class="col-lg-4 col-md-6 project-item-box residential">
                        <!-- Project Item Start -->
                        <div class="project-item wow fadeInUp">
                            <div class="project-image">
                                <a href="{{project.get_absolute_url}}" data-cursor-text="View">
                                    <figure class="image-anime">
                                        <img src="{{project.image.url}}" alt="">
                                    </figure>
                                </a>
                                {% if project.service %}
                                <div class="project-tag">
                                    <a href="{{project.get_absolute_url}}">{{project.service}}</a>
                                </div>
                                {% endif %}
                            </div>
                            <div class="project-content">
                                <h3><a href="{{project.get_absolute_url}}">{{project.title}}</a></h3>
                            </div>
                        </div>
                        <!-- Project Item End -->
                    </div>
                    {% endfor %}
                  

                </div>
                <!-- Project Item Boxes End -->
            </div>
        </div>
    </div>
</div>
<!-- Page Projects End -->

{% endblock %}
