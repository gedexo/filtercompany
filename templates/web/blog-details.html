{% extends 'web/base.html' %}
{% load static %}
{% block title %}{{blog.title}}{% endblock %}
{% block content %}
  <!-- Page Header Start -->
  <div class="page-header parallaxie">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-12">
                <!-- Page Header Box Start -->
                <div class="page-header-box">
                    <h1 class="wow fadeInUp" data-cursor="-opaque">{{blog.title}}</h1>
                    <div class="post-single-meta wow fadeInUp">
                        <ol class="breadcrumb">
                            <li><i class="fa-regular fa-clock"></i> {{blog.date|date:"d M Y"}}</li>
                        </ol>
                    </div>
                </div>
                <!-- Page Header Box End -->
            </div>
        </div>
    </div>
</div>
<!-- Page Header End -->

<!-- Page Single Post Start -->
<div class="page-single-post">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="post-content">
                    <!-- Post Featured Image Start -->
                    {% if blog.image %}
                    <div class="post-image">
                        <figure>
                            <img src="{{blog.image.url}}" alt="{{blog.image_alt_text|default:blog.title}}">
                        </figure>
                    </div>
                    {% endif %}
                    <!-- Post Featured Image End -->

                    <!-- Post Entry Start -->
                    <article class="post-entry blog-rich-content">
                        {{blog.content|safe}}
                    </article>
                    <!-- Post Entry End -->
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Page Single Post End -->

{% endblock %}
