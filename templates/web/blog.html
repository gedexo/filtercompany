{% extends 'web/base.html' %}
{% load static %}
{% block title %}Blog{% endblock %}
{% block content %}

    <!-- Page Header Start -->
	<div class="page-header parallaxie">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-lg-12">
					<!-- Page Header Box Start -->
					<div class="page-header-box">
						<h1 class="wow fadeInUp" data-cursor="-opaque">our blog</h1>
						<nav class="wow fadeInUp" data-wow-delay="0.2s">
                            <ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="/l">home</a></li>
								<li class="breadcrumb-item active" aria-current="page">our blog</li>
							</ol>
						</nav>
					</div>
					<!-- Page Header Box End -->
				</div>
			</div>
		</div>
	</div>
	<!-- Page Header End -->

    <!-- Page Blog Start -->
    <div class="page-blog">
        <div class="container">
            <div class="row">
                {% for blog in blogs %}
                <div class="col-lg-4 col-md-6">
                    <!-- Post Item Start -->
                    <div class="post-item wow fadeInUp">
                        <!-- Post Featured Image Start-->
                        <div class="post-featured-image">
                            <a href="{{blog.get_absolute_url}}" data-cursor-text="View">
                                <figure class="image-anime">
                                    <img src="{{blog.image.url}}" alt="">
                                </figure>
                            </a>

                            <!-- Post Item Tag Start -->
                            <div class="post-item-meta">
                                <a href="#">{{ blog.date|date:"d M" }}</a>
                            </div>
                            <!-- Post Item Tag End -->
                        </div>
                        <!-- Post Featured Image End -->

                        <!-- Post Item Body Start -->
                        <div class="post-item-body">
                            <!-- Post Item Content Start -->
                            <div class="post-item-content">
                                <h2><a href="{{blog.get_absolute_url}}">{{blog.title}}</a></h2>
                            </div>
                            <!-- Post Item Content End -->

                            <!-- Blog Item Button Start -->
                            <div class="blog-item-btn">
                                <a href="{{blog.get_absolute_url}}" class="readmore-btn">read more</a>
                            </div>
                            <!-- Blog Item Button End -->
                        </div>
                        <!-- Post Item Body End -->
                    </div>
                    <!-- Post Item End -->
                </div>
                {% endfor %}
              
            </div>
        </div>
    </div>
    <!-- Page Blog End -->



{% endblock %}
