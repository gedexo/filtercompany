<VirtualHost *:80>
        ServerName test.pixelbytz.com
        ServerAlias www.test.pixelbytz.com
        Redirect permanent / https://test.pixelbytz.com/ 
  
        RewriteEngine on
        RewriteCond %{SERVER_NAME} =test.pixelbytz.com [OR]
        RewriteCond %{SERVER_NAME} =www.test.pixelbytz.com
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
        ServerAdmin admin@test.pixelbytz.com
        ServerName test.pixelbytz.com
        ServerAlias www.test.pixelbytz.com
        
        DocumentRoot /home/srv/filtercompany
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        Alias /static /home/srv/filtercompany/filtercompany/static
        <Directory /home/srv/filtercompany/filtercompany/static>
                Require all granted
        </Directory>

        Alias /media /home/srv/filtercompany/filtercompany/media
        <Directory /home/srv/filtercompany/filtercompany/media>
                Require all granted
        </Directory>

        <Directory /home/srv/filtercompany/filtercompany/filtercompany>
            <Files wsgi.py>
                    Require all granted
            </Files>
        </Directory>

        WSGIDaemonProcess    filtercompany python-path=/home/srv/filtercompany/filtercompany python-home=/home/srv/filtercompany/venv
        WSGIProcessGroup filtercompany
        WSGIScriptAlias / /home/srv/filtercompany/filtercompany/filtercompany/wsgi.py





</VirtualHost>
